spring.application.name=pfe_back
server.port=8080

# All values below can be overridden by environment variables (Spring Boot
# relaxed-binding maps SPRING_DATASOURCE_URL -> spring.datasource.url, etc.).
# Required env vars (no defaults — app fails to start without them):
#   SPRING_DATASOURCE_PASSWORD
#   APP_JWT_SECRET   (>= 32 chars)
# In Docker, docker-compose.yml provides both; outside Docker you must export
# them in your shell before running `mvnw spring-boot:run`.

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devsecops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false


logging.level.org.springframework.security=INFO

# --- CORS (local dev) ---
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# --- JWT ---
# Default below is a randomly generated 48-byte base64 secret committed for
# local dev only. Override APP_JWT_SECRET in production / docker-compose with
# your own secret (>= 32 bytes).
app.jwt.secret=${APP_JWT_SECRET:PJoOT0UnlW2ET30Xtx58WadbcRHDeUzVTSWNqwwKQdxm8mSOz6rytlB0SR62Rah/}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Azure SDK (real-time infra sync) ---
# Uses DefaultAzureCredential — one code path, four ways to authenticate:
#   - Local dev  : run `az login` on your machine. Nothing else needed.
#   - IDE        : sign in via VS Code / IntelliJ Azure plugin.
#   - Docker/CI  : set APP_AZURE_CLIENT_ID + APP_AZURE_CLIENT_SECRET here.
#   - Prod (Azure): use Managed Identity — no secrets anywhere.
# In every mode you still need tenant + subscription so the SDK targets the
# right directory. Leave them empty to disable Azure sync (DB-only mode).
app.azure.tenant-id=${APP_AZURE_TENANT_ID:}
app.azure.client-id=${APP_AZURE_CLIENT_ID:}
app.azure.client-secret=${APP_AZURE_CLIENT_SECRET:}
app.azure.subscription-id=${APP_AZURE_SUBSCRIPTION_ID:}
app.azure.resource-group=${APP_AZURE_RESOURCE_GROUP:}

# --- Infra sync engine ---
app.infra.poll.enabled=${APP_INFRA_POLL_ENABLED:true}
app.infra.poll.rg-seconds=${APP_INFRA_POLL_RG_SECONDS:30}
# Shared HMAC secret used by GitHub Actions to call /api/infra/sync/trigger
app.infra.webhook-secret=${APP_INFRA_WEBHOOK_SECRET:pfeDevSecOpsWebhookSecret32CharsExact}

