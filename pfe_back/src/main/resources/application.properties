spring.application.name=pfe_back
server.port=8080

# All values below can be overridden by environment variables (Spring Boot
# relaxed-binding maps SPRING_DATASOURCE_URL -> spring.datasource.url, etc.).
# Required env vars (no defaults — app fails to start without them):
#   SPRING_DATASOURCE_PASSWORD
#   APP_JWT_SECRET   (>= 32 chars)
# In Docker, docker-compose.yml provides both; outside Docker you must export
# them in your shell before running `mvnw spring-boot:run`.

# --- MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devsecops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# REQUIRED in prod — defaults to empty for local MySQL without a root password.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# --- H2 in-memory (disabled) ---
#spring.datasource.url=jdbc:h2:mem:devsecops;DB_CLOSE_DELAY=-1;MODE=MySQL
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

logging.level.org.springframework.security=INFO

# --- JWT ---
# Default below is a randomly generated 48-byte base64 secret committed for
# local dev only. Override APP_JWT_SECRET in production / docker-compose with
# your own secret (>= 32 bytes).
app.jwt.secret=${APP_JWT_SECRET:PJoOT0UnlW2ET30Xtx58WadbcRHDeUzVTSWNqwwKQdxm8mSOz6rytlB0SR62Rah/}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
