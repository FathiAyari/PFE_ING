name: Terraform — Azure infra

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: 'true'
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: terraform ${{ github.event.inputs.action || (github.event_name == 'pull_request' && 'plan' || 'apply') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init (Azure Storage backend)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=pfe-devsecops.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
        run: |
          terraform plan -input=false -no-color \
            -var "ssh_public_key=${{ secrets.TF_SSH_PUBLIC_KEY }}" \
            -var "location=${{ secrets.AZURE_LOCATION }}" \
            -out=tfplan

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform apply -input=false -auto-approve \
            -var "ssh_public_key=${{ secrets.TF_SSH_PUBLIC_KEY }}" \
            -var "location=${{ secrets.AZURE_LOCATION }}"

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var "ssh_public_key=${{ secrets.TF_SSH_PUBLIC_KEY }}" \
            -var "location=${{ secrets.AZURE_LOCATION }}"

      - name: Export outputs (apply only)
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform output -json > tf-outputs.json
          echo "### Terraform outputs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat tf-outputs.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Notify backend to sync Azure inventory
        if: |
          success() && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan')
          )
        env:
          BACKEND_URL: ${{ secrets.BACKEND_WEBHOOK_URL }}
          HMAC_SECRET: ${{ secrets.INFRA_WEBHOOK_HMAC_SECRET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$HMAC_SECRET" ]; then
            echo "Backend webhook not configured (set BACKEND_WEBHOOK_URL + INFRA_WEBHOOK_HMAC_SECRET secrets); skipping."
            exit 0
          fi
          WEBHOOK_URL="${BACKEND_URL%/}"
          case "$WEBHOOK_URL" in
            */api/infra/sync/trigger) ;;
            *) WEBHOOK_URL="$WEBHOOK_URL/api/infra/sync/trigger" ;;
          esac
          BODY="{\"correlationId\":\"$RUN_ID\",\"runId\":\"$RUN_ID\"}"
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HMAC_SECRET" -hex | awk '{print $2}')
          for i in 1 2 3; do
            echo "Calling backend (attempt $i)..."
            if curl -fsS -X POST "$WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -H "X-Hub-Signature-256: sha256=$SIG" \
                -d "$BODY"; then
              echo "Backend sync triggered."
              exit 0
            fi
            sleep 10
          done
          echo "Backend webhook failed after 3 attempts." && exit 1

      - name: Upload outputs artifact
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: infra/tf-outputs.json
          if-no-files-found: warn